<!DOCTYPE html>
<html>
<head>
    <title>String Length</title>
</head>
<body>
    <h2>Find Length of a String</h2>

    <input type="text" id="str" placeholder="Enter a string">
    <button onclick="findLength()">Find Length</button>

    <p id="result"></p>

    <script>
        function findLength() {
            let s = document.getElementById("str").value;
            let len = s.length;

            document.getElementById("result").innerHTML =
                "Length of string: " + len;
        }
    </script>
</body>
</html>
